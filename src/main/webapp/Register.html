<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>

<link rel="stylesheet" href="./CSS/style.css">
</head>
<body>
<center>
	<h1>Welcome to Register Page</h1>
	<form action="RegisterAction" method="post">
	<table border="1">
		<tr>
			<th>User Id: </th>
			<td> <input type="text" name="uid" placeholder="UserID in Numnbers"> </td>
		</tr>
		<tr>
			<th>Password: </th>
			<td> <input type="password" name="pa"> </td>
		</tr>
		<tr>
			<th>Full Name: </th>
			<td> <input type="text" name="fn"> </td>
		</tr>
		<tr>
			<th>Email: </th>
			<td> <input type="email" name="em"> </td>
		</tr>
		<tr>
			<th>Gender: </th>
			<td> 
				<input type="radio" name="gn" value="Male"> Male 
				<input type="radio" name="gn" value="Female"> Female
			</td>
		</tr>
		<tr>
			<th>Country: </th>
			<td> 
			
			<select name="con">
						<option value="india">India</option>
						<option value="usa">USA</option>
						<option value="china">China</option>
						<option value="austraila">Austraila</option>
						<option value="paris">Paris</option>
			</select> 
			
			</td>
		</tr>
		
		<tr>
			<td colspan="2" style="text-align: center;"> <input type="submit" value="SignUp"> </td>
		</tr>
	</table>
	</form>
	</center>
</body>
</html>
